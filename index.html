<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Under Construction</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6; /* Change this to match your brand color */
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }

        .icon {
            margin-bottom: 2rem;
        }

        .icon svg {
            width: 64px;
            height: 64px;
            color: var(--accent);
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.025em;
        }

        p {
            font-size: 1.125rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* Typing effect cursor */
        .cursor {
            display: inline-block;
            width: 3px;
            height: 1.1em;
            background-color: var(--accent);
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }

        /* Dynamic Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        .progress-container {
            width: 100%;
            height: 4px;
            background-color: #1e293b;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 2rem;
        }

        .progress-bar {
            height: 100%;
            width: 30%;
            background-color: var(--accent);
            border-radius: 2px;
            animation: load 2s ease-in-out infinite alternate;
        }

        @keyframes load {
            0% { width: 10%; transform: translateX(0); }
            100% { width: 40%; transform: translateX(150%); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">
            <!-- Simple code icon SVG -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
            </svg>
        </div>
        
        <h1><span id="typewriter"></span><span class="cursor"></span></h1>
        
        <p>We are currently deploying updates and building something awesome. Please check back soon.</p>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </div>

    <script>
        const text = "Site Under Construction.";
        let i = 0;
        const speed = 75; // Typing speed in ms

        function typeWriter() {
            if (i < text.length) {
                document.getElementById("typewriter").innerHTML += text.charAt(i);
                i++;
                setTimeout(typeWriter, speed);
            }
        }

        // Trigger the typing effect once the page loads
        window.onload = typeWriter;
    </script>

</body>
</html>
